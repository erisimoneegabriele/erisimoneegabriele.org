<!DOCTYPE html>
<html lang="it">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>Test Gboard</title>
</head>
<body style="background:#121212;color:#fff;font-family:sans-serif;padding:20px;text-align:center">
  <h2 style="color:#ffd54f;margin-bottom:14px">Tocca il box e usa il microfono Gboard</h2>
  <textarea id="box" rows="5" placeholder="Detta qui con Gboard..." style="width:100%;font-size:1.7rem;padding:16px;border-radius:16px;border:3px solid #ffd54f;background:#1e1e1e;color:#fff"></textarea>
  <button id="invia" style="width:100%;margin-top:18px;padding:26px;font-size:1.7rem;font-weight:bold;background:#2e7d32;color:#fff;border:none;border-radius:16px">
    📨 INVIA SU WHATSAPP
  </button>

  <script>
    const sl = String.fromCharCode(47);
    const doppiaBarra = sl + sl;
    const box = document.getElementById("box");
    const invia = document.getElementById("invia");

    invia.onclick = function() {
      const testo = box.value.trim();
      if (!testo) {
        box.focus();
        return;
      }
      window.location.href = "https:" + doppiaBarra + "wa.me" + sl + "393330000000?text=" + encodeURIComponent(testo);
    };
  </script>
</body>
</html>
